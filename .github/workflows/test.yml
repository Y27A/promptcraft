name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [client, server, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd ${{ matrix.package }} && npm install --legacy-peer-deps

      - name: Run tests with coverage
        run: cd ${{ matrix.package }} && npm run test:coverage
