<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PromptCraft</title>
  <script>
    // GitHub Pages SPA redirect: encode the full path into the query string
    // so index.html can restore it via history.replaceState
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/promptcraft/?p=/' +
      l.pathname.slice('/promptcraft/'.length).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
